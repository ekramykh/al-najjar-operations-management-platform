<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set Password · Al Najjar</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f19;color:#e2e8f0;font:15px system-ui,sans-serif}.card{width:100%;max-width:440px;padding:30px;background:#111827;border:1px solid #334155;border-radius:16px}h1{font-size:24px;margin:12px 0}p{color:#94a3b8;line-height:1.6}label{display:block;margin-top:18px;font-size:13px}input,button{width:100%;padding:12px;border-radius:8px;margin-top:7px;font:inherit}input{border:1px solid #475569;background:#0b0f19;color:white}button{background:#2563eb;color:white;border:0;margin-top:22px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#resetStatus{min-height:42px;font-size:13px;overflow-wrap:anywhere}.credit{font-size:11px;text-align:center;margin-top:24px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script></head>
<body><main class="card"><small>AL NAJJAR · OPERATIONS MANAGEMENT PLATFORM</small><h1>Choose a new password</h1><p>Use the secure link sent to your email. Your account permissions will stay the same.</p><form id="passwordResetForm"><label for="newPassword">New password · at least 8 characters</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required disabled><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required disabled><button id="saveNewPassword" type="submit" disabled>Save new password</button></form><p id="resetStatus" role="status" aria-live="polite">Checking your secure link…</p><p class="credit">Designed and Programmed by: Ekramy Kholosy</p></main>
<script>
'use strict';
const resetForm=document.getElementById('passwordResetForm');
const newPassword=document.getElementById('newPassword'),confirmPassword=document.getElementById('confirmPassword');
const savePassword=document.getElementById('saveNewPassword'),resetStatus=document.getElementById('resetStatus');
let recoveryClient=null,recoveryVerified=false,resetBusy=false;
function setRecoveryStatus(text){resetStatus.textContent=text;}
function setRecoveryControls(enabled){for(const el of [newPassword,confirmPassword,savePassword])el.disabled=!enabled;}
async function initializePasswordRecovery(){
 try {
  const params=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));
  const project=params.get('project_url'),publicKey=params.get('public_key');
  const type=params.get('type') || fragment.get('type');
  if(!/^https:\/\/(lfmuxtnurxaanixxflwc|mykwxfifrjohhjhomegf)\.supabase\.co$/.test(project || '') || !publicKey || !['recovery','invite'].includes(type))throw new Error('Invalid recovery link. Ask your administrator to send a new link.');
  if(!window.supabase?.createClient)throw new Error('Connection library could not load. Reopen the link with an internet connection.');
  recoveryClient=window.supabase.createClient(project,publicKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:true,flowType:'implicit',storageKey:'najjar-password-recovery'}});
  const tokenHash=params.get('token_hash');
  const result=tokenHash?await recoveryClient.auth.verifyOtp({token_hash:tokenHash,type}):await recoveryClient.auth.getSession();
  if(result.error || !result.data.session)throw new Error('This link is expired, invalid or already used. Ask your administrator for a new link.');
  const verified=await recoveryClient.auth.getUser();
  if(verified.error || !verified.data.user)throw new Error('Unable to verify the recovery session. Request a new link.');
  recoveryVerified=true;setRecoveryControls(true);setRecoveryStatus('Verified account: '+(verified.data.user.email || '')+'. Choose your new password.');
 }catch(error){setRecoveryControls(false);setRecoveryStatus(error.message || 'Unable to verify this link.');}
 finally {history.replaceState(null,'',location.pathname);}
}
resetForm.addEventListener('submit',async event=>{
 event.preventDefault();if(resetBusy || !recoveryVerified)return;
 if(newPassword.value.length<8){setRecoveryStatus('Use at least 8 characters.');return;}
 if(newPassword.value!==confirmPassword.value){setRecoveryStatus('The passwords do not match.');return;}
 resetBusy=true;setRecoveryControls(false);setRecoveryStatus('Saving your new password…');
 try {
  const verified=await recoveryClient.auth.getUser();
  if(verified.error || !verified.data.user)throw new Error('Your recovery session expired. Request a new link.');
  const {error}=await recoveryClient.auth.updateUser({password:newPassword.value});
  if(error)throw error;
  recoveryVerified=false;newPassword.value='';confirmPassword.value='';
  try {await recoveryClient.auth.signOut({scope:'local'});}catch(_){}
  setRecoveryStatus('Password saved. Close this tab and sign in to the application with your new password.');
 }catch(error){setRecoveryStatus(error.message || 'Password could not be saved.');setRecoveryControls(true);}
 finally {resetBusy=false;}
});
const passwordRecoveryReady=initializePasswordRecovery();
</script></body></html>
