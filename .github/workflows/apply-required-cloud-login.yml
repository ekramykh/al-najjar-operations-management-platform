name: Apply required cloud login gate
on:
  push:
    branches:
      - fix-auth-required-before-offline-entry-2026-10-07
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css='''<style id="requiredCloudLoginGateStyles">
          html.cloud-login-locked,html.cloud-login-locked body{overflow:hidden!important}
          #requiredCloudLoginGate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,7,18,.97);backdrop-filter:blur(8px)}
          #requiredCloudLoginGate .gate-card{width:min(460px,100%);background:#111827;color:#f9fafb;border:1px solid #334155;border-radius:16px;padding:28px;box-shadow:0 24px 80px #0009;font-family:Inter,"Segoe UI",Arial,sans-serif}
          #requiredCloudLoginGate h2{margin:0 0 8px;font-size:22px}#requiredCloudLoginGate p{margin:0 0 18px;color:#cbd5e1;line-height:1.55;font-size:13px}
          #requiredCloudLoginGate label{display:block;margin:11px 0 5px;color:#cbd5e1;font-size:12px;font-weight:600}
          #requiredCloudLoginGate input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;outline:none}
          #requiredCloudLoginGate button{width:100%;margin-top:16px;padding:11px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
          #requiredCloudLoginGate button:disabled{opacity:.65;cursor:wait}#requiredCloudLoginStatus{min-height:20px;margin-top:12px;font-size:12px;line-height:1.5}
          </style>'''
          tag='<script src="required-cloud-login-gate.js"></script>'
          if "required-cloud-login-gate.js" not in s:
              s=s.replace("</head>",css+"\n</head>")
              s=s.replace("</body>",tag+"\n</body>")
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-required-cloud-login.yml
          git commit -m "fix: require cloud login before system access"
          git push
