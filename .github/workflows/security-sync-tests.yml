name: Secure sync regression tests
on:
  push:
    branches: [security-server-side-auth-2026-10-10, review-ui-permission-guards-2026-10-11, feature-trip-invoices-2026-10-12]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.cjs
