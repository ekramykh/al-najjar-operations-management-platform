name: Deploy fuel-sync Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fuel-sync-production
  cancel-in-progress: false

jobs:
  deploy-fuel-sync:
    name: Deploy fuel-sync to the configured Supabase project
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          ref: security-server-side-auth-2026-10-10
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy only fuel-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID"
            exit 1
          fi
          supabase functions deploy fuel-sync --project-ref "${SUPABASE_PROJECT_ID}"
